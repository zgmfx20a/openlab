    let animationRunning = false;
    
    function animate() {
      if (!animationRunning) {
        animationRunning = true;
      }
      requestAnimationFrame(animate);
      
      // アバター更新
      if (playerAvatar) {
        // 位置を先に保存（絶対的な基準位置）
        const savedPosition = new THREE.Vector3().copy(playerPosition);
        const savedRotation = playerRotation;
        
        // アバター更新前にもアバターの位置を固定
        if (playerAvatar.character && playerAvatar.character.currentVrm) {
          const scene = playerAvatar.character.currentVrm.scene;
          scene.position.copy(savedPosition);
          scene.rotation.y = savedRotation;
          
          // ルートボーンの位置をリセット（もしあれば）
          if (scene.children && scene.children.length > 0) {
            const root = scene.children[0];
            if (root && root.isSkinnedMesh === false) {
              // ルートボーンの位置を0に固定
              root.position.set(0, 0, 0);
            }
          }
        }
        
        // アバター更新
        playerAvatar.update();
        
        // アニメーション更新後、即座に位置を強制リセット（最優先）
        if (playerAvatar.character && playerAvatar.character.currentVrm) {
          const scene = playerAvatar.character.currentVrm.scene;
          
          // 位置と回転を強制的に戻す（3回実行で確実に）
          scene.position.set(savedPosition.x, savedPosition.y, savedPosition.z);
          scene.rotation.y = savedRotation;
          scene.updateMatrixWorld(true);
          
          // ルートボーンの位置も再リセット
          if (scene.children && scene.children.length > 0) {
            const root = scene.children[0];
            if (root && root.isSkinnedMesh === false) {
              root.position.set(0, 0, 0);
            }
          }
          
          // 最終確認：再度位置を設定
          scene.position.set(savedPosition.x, savedPosition.y, savedPosition.z);
          scene.rotation.y = savedRotation;
        }
      }
      // judgeAvatarは削除済み
      
      // プレイヤー移動更新
      updatePlayerMovement();
      
      // パンチのクールダウンを更新
      if (punchCooldown > 0) {
        punchCooldown--;
      }
      
      // 飛行物体の更新
      updateFlyingObject();
      
      // サーチライトレーザーの更新（飛行物体に追従、当たり判定）
      updateSearchlightLaser();
      
      // 焼けた地面のマーカーの更新
      updateBurnedGroundMarks();
      
      // モニターのフレームの光を点滅させる（緊迫感のある雰囲気）
      if (monitorLeft && monitorLeft.children.length > 0) {
        const frame = monitorLeft.children[0];
        if (frame && frame.material) {
          const time = Date.now() * 0.003;
          frame.material.emissiveIntensity = 0.3 + Math.sin(time) * 0.3;
        }
      }
      if (monitorRight && monitorRight.children.length > 0) {
        const frame = monitorRight.children[0];
        if (frame && frame.material) {
          const time = Date.now() * 0.003;
          frame.material.emissiveIntensity = 0.3 + Math.sin(time) * 0.3;
        }
      }
      
      // 水のエフェクト更新
      updateWaterEffects();
      
      // 雨のアニメーション更新
      updateRain();
      
      // ネオンライトの点滅アニメーション
      updateNeonLights();
      
      // カメラがプレイヤーを追従（方向は一定、前後のみ移動）
      if (playerAvatar && camera && (gameState === 'playing' || gameState === 'quiz-input')) {
        // X方向は固定（横移動なし）、Z方向のみ追尾
        const targetZ = playerPosition.z + 5; // プレイヤーの後ろ5ユニット（10 → 5に変更）
        const targetY = 2; // 高さは一定（3 → 2に変更）
        
        // YとZのみ滑らかに追尾
        camera.position.y += (targetY - camera.position.y) * 0.1;
        camera.position.z += (targetZ - camera.position.z) * 0.1;
        // Xは0に固定（中央から見る）
        camera.position.x = 0;
        
        // カメラは常に前を向く（方向は一定）
        camera.lookAt(0, playerPosition.y + 1, playerPosition.z);
      }
      
      renderer.render(scene, camera);
    }

    // ============================================
    // ゲームパッドの〇ボタンとAボタンでオープニング開始・ゲーム開始
    // ============================================
    function checkGamepadForStart() {
      let lastCircleButtonState = false;
      let lastCrossButtonState = false; // ●ボタン（×ボタン）の状態
      let lastAButtonState = false; // Aボタンの状態
      let circleButtonPressCount = 0; // 〇ボタンの連続押下回数
      let lastCircleButtonPressTime = 0; // 最後に〇ボタンを押した時刻
      const CIRCLE_BUTTON_DOUBLE_PRESS_TIME = 500; // 2回押しの判定時間（ミリ秒）
      
      const checkGamepad = () => {
        const gamepads = navigator.getGamepads();
        for (let i = 0; i < gamepads.length; i++) {
          const gamepad = gamepads[i];
          if (!gamepad) continue;
          
          // 〇ボタンの検出（PS5: buttons[1]）
          const circleButtonPressed = gamepad.buttons[1]?.pressed || false;
          
          // Aボタンの検出（Xbox: buttons[0]がAボタン、PS5では×ボタンなので別途処理）
          // Xboxコントローラーの場合のみAボタンとして扱う
          // PS5コントローラーの場合は×ボタンとして既に処理されている
          const isXboxController = gamepad.id && (gamepad.id.includes('Xbox') || gamepad.id.includes('xbox') || gamepad.id.includes('Microsoft'));
          const aButtonPressed = isXboxController && (gamepad.buttons[0]?.pressed || false);
          
          // ●ボタン（×ボタン）の検出（PS5: buttons[0], Xbox: buttons[2]）
          const crossButtonPressed = (!isXboxController && gamepad.buttons[0]?.pressed) || (isXboxController && gamepad.buttons[2]?.pressed) || false;
          
          // 〇ボタンが押された瞬間を検出
          if (circleButtonPressed && !lastCircleButtonState) {
            const currentTime = Date.now();
            
            // オープニング映像がまだ流れていない場合
            if (!openingPlayedOnce && !openingPlaying && (gameState === 'initializing' || gameState === 'title')) {
              startOpeningVideo();
              circleButtonPressCount = 1;
              lastCircleButtonPressTime = currentTime;
            }
            // オープニング再生中の場合
            else if (openingPlaying) {
              // 1回押しでスキップ（Enterキーと同様）
              skipOpeningVideo();
            }
            // オープニング再生後、タイトル画面の場合（タイトル画面は削除済みのため、この処理は不要）
            // オープニング映像が一度流れたら、〇ボタンはパンチ専用（updateGamepadInputで処理される）
          }
          
          // Aボタンが押された瞬間を検出
          if (aButtonPressed && !lastAButtonState) {
            const currentTime = Date.now();
            
            // オープニング映像がまだ流れていない場合
            if (!openingPlayedOnce && !openingPlaying && (gameState === 'initializing' || gameState === 'title')) {
              startOpeningVideo();
            }
            // オープニング再生中の場合
            else if (openingPlaying) {
              skipOpeningVideo();
            }
            // オープニング再生後、タイトル画面の場合（タイトル画面は削除済みのため、この処理は不要）
          }
          
          // ●ボタン（×ボタン）が押された瞬間を検出（タイトル画面は削除済みのため、この処理は不要）
          
          lastCircleButtonState = circleButtonPressed;
          lastCrossButtonState = crossButtonPressed;
          lastAButtonState = aButtonPressed;
        }
        
        requestAnimationFrame(checkGamepad);
      };
      
      checkGamepad();
    }
    
    // ============================================

    function initOpeningKeyboardControls() {

      let lastEnterKeyPressTime = 0;
      const ENTER_KEY_DOUBLE_PRESS_TIME = 500; // 2回押しの判定時間（ミリ秒）
      
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.code === 'Enter') {
          const currentTime = Date.now();
          const enterKeyPressed = true;
          
          if (enterKeyPressed && !lastEnterKeyState) {
            // オープニング映像がまだ流れていない場合
            if (!openingPlayedOnce && !openingPlaying && (gameState === 'initializing' || gameState === 'title')) {
              startOpeningVideo();
              enterKeyPressCount = 1;
              lastEnterKeyPressTime = currentTime;
            }
            // オープニング再生中の場合
            else if (openingPlaying) {
              // Enterキーでスキップ
              skipOpeningVideo();
              enterKeyPressCount = 0;
            }
            // オープニング再生後、タイトル画面の場合（タイトル画面は削除済みのため、この処理は不要）
          }
          
          lastEnterKeyState = enterKeyPressed;
        }
      });
      
      window.addEventListener('keyup', (e) => {
        if (e.key === 'Enter' || e.code === 'Enter') {
          lastEnterKeyState = false;
        }
      });
    }

        avatarSelectScene.add(spotLight2);
        avatarSelectScene.add(spotLight2.target);
        
        // 床（さらに明るく）
        const floorGeometry = new THREE.PlaneGeometry(20, 20);
        const floorMaterial = new THREE.MeshStandardMaterial({ color: 0x777777 }); // さらに明るい床
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        avatarSelectScene.add(floor);
        
        // アバターを読み込んで表示
        updateStatus('アバターを読み込み中...');
        
        // sample5を左側に
        previewAvatar5 = await GVRM.load('../gvrm/sample5.gvrm', avatarSelectScene, avatarSelectCamera, avatarSelectRenderer, 'sample5.gvrm');
        previewAvatar5.character.currentVrm.scene.position.set(-3, 0, 0);
        await previewAvatar5.changeFBX('../fbx/Idle.fbx');
        
        // sample9を右側に
        previewAvatar9 = await GVRM.load('../gvrm/sample9.gvrm', avatarSelectScene, avatarSelectCamera, avatarSelectRenderer, 'sample9.gvrm');
        previewAvatar9.character.currentVrm.scene.position.set(3, 0, 0);
        await previewAvatar9.changeFBX('../fbx/Idle.fbx');
        
        // アニメーションループ開始
        avatarSelectAnimationRunning = true;
        animateAvatarSelect();
        
        updateStatus('アバター選択画面');
      } catch (error) {
        console.error('アバター選択3D初期化エラー:', error);
      }
    }
    
    function animateAvatarSelect() {
      if (!avatarSelectAnimationRunning) return;
      
      requestAnimationFrame(animateAvatarSelect);
      
      if (previewAvatar5) previewAvatar5.update();
      if (previewAvatar9) previewAvatar9.update();
      
      // カメラを回転
      if (avatarSelectCamera) {
        const time = Date.now() * 0.0005;
        avatarSelectCamera.position.x = Math.sin(time) * 8;
        avatarSelectCamera.position.z = Math.cos(time) * 8;
        avatarSelectCamera.position.y = 2 + Math.sin(time * 2) * 0.5;
        avatarSelectCamera.lookAt(0, 0, 0);
      }
      
      if (avatarSelectRenderer && avatarSelectScene && avatarSelectCamera) {
        avatarSelectRenderer.render(avatarSelectScene, avatarSelectCamera);
      }
    }
    
    function initAvatarSelection() {
      const avatarOptions = document.querySelectorAll('.avatar-option');
      const confirmBtn = document.getElementById('confirm-avatar-btn');
      
      avatarOptions.forEach(option => {
        option.onclick = () => {
          // 選択状態をリセット
          avatarOptions.forEach(opt => opt.classList.remove('selected'));
          // 選択状態を追加
          option.classList.add('selected');
          selectedPlayerAvatar = option.dataset.avatar;
          confirmBtn.disabled = false;
          
          // 3Dアバターにもハイライト効果を追加（より明確なサイズ変化）
          if (selectedPlayerAvatar === 'sample5' && previewAvatar5) {
            previewAvatar5.character.currentVrm.scene.scale.setScalar(1.4);
            if (previewAvatar9) previewAvatar9.character.currentVrm.scene.scale.setScalar(1.0);
          } else if (selectedPlayerAvatar === 'sample9' && previewAvatar9) {
            previewAvatar9.character.currentVrm.scene.scale.setScalar(1.4);
            if (previewAvatar5) previewAvatar5.character.currentVrm.scene.scale.setScalar(1.0);
          }
        };
      });
      
      confirmBtn.onclick = async () => {
        if (!selectedPlayerAvatar) return;
        
        // 3Dアバター選択画面を停止
        avatarSelectAnimationRunning = false;
        if (avatarSelectRenderer && avatarSelectRenderer.domElement) {
          avatarSelectRenderer.domElement.remove();
        }
        
        document.getElementById('avatar-select-screen').classList.remove('active');
        
        // 直接3Dワールドに入る（写真撮影をスキップ）
        await startGameDirectly();
      };
    }
    
    // 直接3Dワールドを開始（写真撮影なし）
    async function startGameDirectly() {
      try {
        console.log('=== 直接3Dワールド開始 ===');
        
        // ダミーの顔画像を作成（使用しないが、エラーを防ぐため）
        const dummyCanvas = document.createElement('canvas');
        dummyCanvas.width = 640;
        dummyCanvas.height = 480;
        const ctx = dummyCanvas.getContext('2d');
        const gradient = ctx.createLinearGradient(0, 0, 640, 480);
        gradient.addColorStop(0, '#87CEEB');
        gradient.addColorStop(1, '#4682B4');
        ctx.fillStyle = gradient;
        ctx.fillRect(0, 0, 640, 480);
        capturedFaceImage = dummyCanvas.toDataURL('image/jpeg', 0.85);
        
        // ローディング画面を表示
        const loadingScreen = document.getElementById('loading-screen');
        loadingScreen.classList.remove('hidden');
        updateStatus('3D空間を準備中...');
        
        // 3D空間（canvas-container）を表示
        const canvasContainer = document.getElementById('canvas-container');
        if (canvasContainer) {
          canvasContainer.classList.add('active');
          canvasContainer.style.display = 'block';
        }
        
        // Three.js初期化
        updateStatus('3D空間を初期化中...');
        await initThreeJS();
        
        // フィールドの一番奥にオブジェクトを作成
        updateStatus('オブジェクトを作成中...');
        await createTargetObject();
        
        // 飛行物体を作成
        updateStatus('飛行物体を作成中...');
        createFlyingObject();
        
        // 井戸を作成
        updateStatus('井戸を作成中...');
        createWells();
        
        // ゴミ箱とゴミ袋を作成
        updateStatus('ゴミを作成中...');
        createTrash();
        
        // 荒廃した建物を作成
        updateStatus('建物を作成中...');
        createRuinedBuildings();
        
        // モニターを作成
        updateStatus('モニターを作成中...');
        await createMonitors();
        
        // キーボード操作を初期化
        updateStatus('キーボード操作を設定中...');
        initKeyboardControls();
        
        // アバター読み込み
        updateStatus('アバターを読み込み中...');
        const avatarsLoaded = await loadAvatars();
        if (!avatarsLoaded) {
          throw new Error('アバターの読み込みに失敗しました');
        }
        
        // 体力ゲージを初期化
        healthBarFill = document.getElementById('health-bar-fill');
        if (healthBarFill) {
          updateHealthBar(100); // 初期体力100%
        }
        
        // ローディング画面を非表示
        loadingScreen.classList.add('hidden');
        
        // アニメーションループ開始
        if (!animationRunning) {
          animationRunning = true;
          animate();
        }
        
        // ゲーム状態をplayingに設定
        gameState = 'playing';
        updateStatus('準備完了！WASDキーで移動、Spaceキーで井戸の水を出せます');
        console.log('✓ 直接3Dワールド開始完了');
        
        // バックサウンドを開始
        startBackSound();
      } catch (error) {
        console.error('直接3Dワールド開始エラー:', error);
        updateStatus('エラー: ' + error.message);
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.classList.add('hidden');
        }
        alert(error.message + '\n\nページをリロード（F5キー）してください。');
      }
    }
    
    // AI処理完了後に3D空間を初期化してゲーム開始（新フロー）
    async function startGameAfterQuiz() {
      try {
        console.log('=== startGameAfterQuiz 開始 ===');
        
        // アバター選択画面の3Dを完全に停止（startQuizInputBeforeGameで既に停止済みのため、念のため確認のみ）
        avatarSelectAnimationRunning = false;
        if (avatarSelectRenderer) {
          try {
            if (avatarSelectRenderer.domElement) {
              avatarSelectRenderer.domElement.remove();
            }
            avatarSelectRenderer.dispose();
            // forceContextLossは呼び出さない（ブラウザがブロックする可能性があるため）
          } catch (e) {
            console.warn('アバター選択レンダラークリーンアップ時のエラー（無視）:', e);
          }
          avatarSelectRenderer = null;
        }
        if (avatarSelectScene) {
          while (avatarSelectScene.children.length > 0) {
            const obj = avatarSelectScene.children[0];
            if (obj.geometry) obj.geometry.dispose();
            if (obj.material) {
              if (Array.isArray(obj.material)) {
                obj.material.forEach(mat => {
                  if (mat.map) mat.map.dispose();
                  mat.dispose();
                });
              } else {
                if (obj.material.map) obj.material.map.dispose();
                obj.material.dispose();
              }
            }
            avatarSelectScene.remove(obj);
          }
          avatarSelectScene = null;
        }
        
        // さらに待機してから初期化
        await new Promise(resolve => setTimeout(resolve, 500));
        
        // 3D空間（canvas-container）を表示
        const canvasContainer = document.getElementById('canvas-container');
        if (canvasContainer) {
          canvasContainer.classList.add('active');
          canvasContainer.style.display = 'block';
          console.log('✓ 3D空間を表示');
        }
        
        // Three.js初期化
        updateStatus('3D空間を初期化中...');
        await initThreeJS();
        
          // フィールドの一番奥にオブジェクトを作成
          updateStatus('オブジェクトを作成中...');
          createTargetObject();
        
        // 井戸を作成
        updateStatus('井戸を作成中...');
        createWells();
        
        // ゴミ箱とゴミ袋を作成
        updateStatus('ゴミを作成中...');
        createTrash();
        
        // 荒廃した建物を作成
        updateStatus('建物を作成中...');
        createRuinedBuildings();
        
        // モニターを作成
        updateStatus('モニターを作成中...');
        await createMonitors();
        
        // キーボード操作を初期化
        updateStatus('キーボード操作を設定中...');
        initKeyboardControls();
        
        // アバター読み込み
        updateStatus('アバターを読み込み中...');
        const avatarsLoaded = await loadAvatars();
        if (!avatarsLoaded) {
          throw new Error('アバターの読み込みに失敗しました');
        }
        
        // モニターにクイズ情報を表示（両側のモニターに同じ問題文を表示）
        if (quizData) {
          // updateMonitor1は削除（クイズ要素を削除したため）
          console.log('✓ 問題をモニター1と2（両側）に表示:', quizData.question_text);
        }
        
        // ローディング画面を非表示
        document.getElementById('loading-screen').classList.add('hidden');
        
        // クイズ表示パネルを表示
        const quizDisplayPanel = document.getElementById('quiz-display-panel');
        if (quizDisplayPanel && quizData) {
          quizDisplayPanel.classList.add('active');
          quizDisplayPanel.style.display = 'block';
          document.getElementById('quiz-question').textContent = quizData.question_text;
        }
        
        // アニメーションループ開始
        if (!animationRunning) {
          animationRunning = true;
          animate();
        }
        
        // すぐにゲーム開始
        gameState = 'playing';
        updateStatus('準備完了！WASDキーで○×ゲートに進んでください！');
        console.log('✓ ゲーム開始（playing状態）');
        
        // バックサウンドを開始
        startBackSound();
      } catch (error) {
        console.error('ゲーム初期化エラー:', error);
        const errorMsg = 'ゲーム初期化エラー: ' + error.message + ' (F5キーでページをリロードしてください)';
        updateStatus(errorMsg);
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          const loadingPara = loadingScreen.querySelector('p');
          if (loadingPara) {
            loadingPara.textContent = 'エラー: ' + error.message + '\n\nF5キーでページをリロードしてください';
          }
        }
        alert(error.message + '\n\nページをリロード（F5キー）してください。');
      }
    }
    
    async function startGame() {
      try {
        // アバター選択画面の3Dを完全に停止
        avatarSelectAnimationRunning = false;
        if (avatarSelectRenderer && avatarSelectRenderer.domElement) {
          avatarSelectRenderer.domElement.remove();
        }
        if (avatarSelectScene) {
          while (avatarSelectScene.children.length > 0) {
            avatarSelectScene.remove(avatarSelectScene.children[0]);
          }
        }
        if (avatarSelectRenderer) {
          avatarSelectRenderer.dispose();
        }
        
        // Three.js初期化（既存のcanvasをクリアしてから）
        updateStatus('3D空間を初期化中...');
        await initThreeJS();
        
        // フィールドの一番奥にオブジェクトを作成
        updateStatus('オブジェクトを作成中...');
        await createTargetObject();
        
        // 飛行物体を作成
        updateStatus('飛行物体を作成中...');
        createFlyingObject();
        
        // 井戸を作成
        updateStatus('井戸を作成中...');
        createWells();
        
        // ゴミ箱とゴミ袋を作成
        updateStatus('ゴミを作成中...');
        createTrash();
        
        // 荒廃した建物を作成
        updateStatus('建物を作成中...');
        createRuinedBuildings();
        
        // モニターを作成
        updateStatus('モニターを作成中...');
        await createMonitors();
        
        // キーボード操作を初期化
        updateStatus('キーボード操作を設定中...');
        initKeyboardControls();
        
        // アバター読み込み
        updateStatus('アバターを読み込み中...');
        const avatarsLoaded = await loadAvatars();
        if (!avatarsLoaded) {
          throw new Error('アバターの読み込みに失敗しました');
        }
        
        // 体力ゲージを初期化
        healthBarFill = document.getElementById('health-bar-fill');
        if (healthBarFill) {
          updateHealthBar(100); // 初期体力100%
        }
        
        // ローディング画面を非表示
        document.getElementById('loading-screen').classList.add('hidden');
        
        // アニメーションループ開始
        if (!animationRunning) {
          animationRunning = true;
          animate();
        }
        
        // ゲーム状態をplayingに設定
        gameState = 'playing';
        updateStatus('準備完了！WASDキーで移動、Spaceキーで井戸の水を出せます');
        
        // バックサウンドを開始
        startBackSound();
      } catch (error) {
        console.error('ゲーム初期化エラー:', error);
        updateStatus('ゲーム初期化エラー: ' + error.message);
        document.getElementById('loading-screen').querySelector('p').textContent = 
          'エラー: ' + error.message;
      }
    }
    
    // ============================================
    // 初期化
    // ============================================
    async function init() {
      try {
        // API設定UI
        initSettingsUI();
        
        // タイトル画面とアバター選択の初期化
        initTitleScreen();
        initAvatarSelection();
        
        // ゲーム状態をtitleに設定
        gameState = 'title';
        
        updateStatus('タイトル画面');
      } catch (error) {
        console.error('初期化エラー:', error);
      }
    }
    
    // 初期化開始
    init();

  </script>
