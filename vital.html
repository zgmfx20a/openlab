<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心拍数・血圧計測アプリ</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 800px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 14px;
        }
        
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto 20px;
            border-radius: 15px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        
        #video {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }
        
        #canvas {
            display: none;
        }
        
        .overlay {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
        }
        
        .face-indicator {
            position: absolute;
            border: 3px solid #00ff00;
            border-radius: 10px;
            pointer-events: none;
            transition: all 0.3s ease;
        }
        
        .face-indicator.detecting {
            border-color: #ffcc00;
        }
        
        .controls {
            text-align: center;
            margin: 20px 0;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 0 10px;
            font-weight: bold;
        }
        
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        button.stop {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }
        
        .results {
            display: none;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }
        
        .results.show {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        
        .result-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .result-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .result-value {
            font-size: 42px;
            font-weight: bold;
            color: #333;
        }
        
        .result-value.heart-rate {
            color: #e74c3c;
        }
        
        .result-value.systolic {
            color: #3498db;
        }
        
        .result-value.diastolic {
            color: #2ecc71;
        }
        
        .result-unit {
            font-size: 16px;
            color: #888;
            margin-left: 5px;
        }
        
        .status {
            text-align: center;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .status.measuring {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.ready {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .signal-chart {
            width: 100%;
            height: 100px;
            background: white;
            border-radius: 10px;
            margin-top: 15px;
            overflow: hidden;
        }
        
        #signalCanvas {
            width: 100%;
            height: 100%;
        }
        
        .instructions {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #666;
        }
        
        .instructions h4 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .instructions ul {
            padding-left: 20px;
        }
        
        .instructions li {
            margin-bottom: 5px;
        }
        
        .disclaimer {
            font-size: 11px;
            color: #999;
            text-align: center;
            margin-top: 20px;
            padding: 10px;
            border-top: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>心拍数・血圧計測アプリ</h1>
        <p class="subtitle">Webカメラを使用した非接触生体計測</p>
        
        <div class="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas"></canvas>
            <div class="overlay" id="overlay">カメラ未接続</div>
            <div class="face-indicator" id="faceIndicator" style="display: none;"></div>
        </div>
        
        <div class="controls">
            <button id="startBtn">計測開始</button>
            <button id="stopBtn" class="stop" disabled>計測停止</button>
        </div>
        
        <div class="status" id="status">カメラを起動してください</div>
        
        <div class="results" id="results">
            <div class="result-grid">
                <div class="result-card">
                    <h3>心拍数</h3>
                    <div class="result-value heart-rate" id="heartRate">--</div>
                </div>
                <div class="result-card">
                    <h3>収縮期血圧（上）</h3>
                    <div class="result-value systolic" id="systolic">--</div>
                </div>
                <div class="result-card">
                    <h3>拡張期血圧（下）</h3>
                    <div class="result-value diastolic" id="diastolic">--</div>
                </div>
            </div>
            
            <div class="signal-chart">
                <canvas id="signalCanvas"></canvas>
            </div>
        </div>
        
        <div class="instructions">
            <h4>使用方法</h4>
            <ul>
                <li>「計測開始」ボタンを押してカメラを起動してください</li>
                <li>顔が枠内に収まるように正面を向いてください</li>
                <li>10秒間静かに待ってください</li>
                <li>測定結果が自動的に表示されます</li>
            </ul>
        </div>
        
        <div class="disclaimer">
            ※ このアプリはデモンストレーション用です。医療診断ではありません。<br>
            正確な数値については医療機関にご相談ください。
        </div>
    </div>

    <script>
        class VitalSignMonitor {
            constructor() {
                this.video = document.getElementById('video');
                this.canvas = document.getElementById('canvas');
                this.ctx = this.canvas.getContext('2d');
                this.signalCanvas = document.getElementById('signalCanvas');
                this.signalCtx = this.signalCanvas.getContext('2d');
                
                this.startBtn = document.getElementById('startBtn');
                this.stopBtn = document.getElementById('stopBtn');
                this.statusEl = document.getElementById('status');
                this.resultsEl = document.getElementById('results');
                this.overlayEl = document.getElementById('overlay');
                this.faceIndicator = document.getElementById('faceIndicator');
                
                this.heartRateEl = document.getElementById('heartRate');
                this.systolicEl = document.getElementById('systolic');
                this.diastolicEl = document.getElementById('diastolic');
                
                this.isMeasuring = false;
                this.stream = null;
                this.animationId = null;
                
                this.signalBuffer = [];
                this.filteredBuffer = [];
                this.sampleRate = 30;
                this.measurementDuration = 10000;
                this.measurementStartTime = 0;
                
                this.heartRateHistory = [];
                this.bpSystolicHistory = [];
                this.bpDiastolicHistory = [];
                
                this.initEventListeners();
                this.initSignalCanvas();
            }
            
            initEventListeners() {
                this.startBtn.addEventListener('click', () => this.startMeasurement());
                this.stopBtn.addEventListener('click', () => this.stopMeasurement());
            }
            
            initSignalCanvas() {
                this.signalCanvas.width = this.signalCanvas.offsetWidth * 2;
                this.signalCanvas.height = this.signalCanvas.offsetHeight * 2;
            }
            
            async startMeasurement() {
                try {
                    this.setStatus('カメラを起動中...', 'measuring');
                    this.startBtn.disabled = true;
                    
                    this.stream = await navigator.mediaDevices.getUserMedia({
                        video: {
                            width: { ideal: 640 },
                            height: { ideal: 480 },
                            facingMode: 'user'
                        }
                    });
                    
                    this.video.srcObject = this.stream;
                    await this.video.play();
                    
                    this.canvas.width = this.video.videoWidth;
                    this.canvas.height = this.video.videoHeight;
                    
                    this.overlayEl.textContent = '顔を検出中...';
                    this.faceIndicator.style.display = 'block';
                    
                    this.isMeasuring = true;
                    this.signalBuffer = [];
                    this.filteredBuffer = [];
                    this.heartRateHistory = [];
                    this.bpSystolicHistory = [];
                    this.bpDiastolicHistory = [];
                    this.measurementStartTime = Date.now();
                    
                    this.stopBtn.disabled = false;
                    this.resultsEl.classList.add('show');
                    
                    this.setStatus('計測中... 10秒間静かに待ってください', 'measuring');
                    this.processFrame();
                    
                    setTimeout(() => this.completeMeasurement(), this.measurementDuration);
                    
                } catch (error) {
                    console.error('カメラアクセスエラー:', error);
                    this.setStatus('カメラにアクセスできません', 'error');
                    this.startBtn.disabled = false;
                }
            }
            
            stopMeasurement() {
                this.isMeasuring = false;
                
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }
                
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
                
                this.video.srcObject = null;
                this.startBtn.disabled = false;
                this.stopBtn.disabled = true;
                this.faceIndicator.style.display = 'none';
                this.overlayEl.textContent = 'カメラ未接続';
                this.setStatus('計測を停止しました', 'ready');
            }
            
            processFrame() {
                if (!this.isMeasuring) return;
                
                this.ctx.drawImage(this.video, 0, 0);
                
                const foreheadRegion = this.detectForeheadRegion();
                if (foreheadRegion) {
                    this.updateFaceIndicator(foreheadRegion);
                    const avgColor = this.getAverageColor(foreheadRegion);
                    this.signalBuffer.push({
                        time: Date.now(),
                        r: avgColor.r,
                        g: avgColor.g,
                        b: avgColor.b
                    });
                    
                    const elapsed = Date.now() - this.measurementStartTime;
                    const remaining = Math.max(0, Math.ceil((this.measurementDuration - elapsed) / 1000));
                    this.overlayEl.textContent = `計測中... 残り${remaining}秒`;
                    
                    if (this.signalBuffer.length > this.sampleRate * 5) {
                        this.signalBuffer.shift();
                    }
                    
                    this.updateSignalChart();
                } else {
                    this.overlayEl.textContent = '顔を検出中...';
                }
                
                this.animationId = requestAnimationFrame(() => this.processFrame());
            }
            
            detectForeheadRegion() {
                const width = this.canvas.width;
                const height = this.canvas.height;
                
                const centerX = width / 2;
                const centerY = height * 0.35;
                const regionWidth = width * 0.25;
                const regionHeight = height * 0.12;
                
                return {
                    x: centerX - regionWidth / 2,
                    y: centerY - regionHeight / 2,
                    width: regionWidth,
                    height: regionHeight
                };
            }
            
            updateFaceIndicator(region) {
                const videoRect = this.video.getBoundingClientRect();
                const scaleX = videoRect.width / this.canvas.width;
                const scaleY = videoRect.height / this.canvas.height;
                
                this.faceIndicator.style.left = (region.x * scaleX) + 'px';
                this.faceIndicator.style.top = (region.y * scaleY) + 'px';
                this.faceIndicator.style.width = (region.width * scaleX) + 'px';
                this.faceIndicator.style.height = (region.height * scaleY) + 'px';
            }
            
            getAverageColor(region) {
                const imageData = this.ctx.getImageData(
                    region.x, region.y,
                    region.width, region.height
                );
                
                let r = 0, g = 0, b = 0;
                const pixels = imageData.data.length / 4;
                
                for (let i = 0; i < imageData.data.length; i += 4) {
                    r += imageData.data[i];
                    g += imageData.data[i + 1];
                    b += imageData.data[i + 2];
                }
                
                return {
                    r: r / pixels,
                    g: g / pixels,
                    b: b / pixels
                };
            }
            
            updateSignalChart() {
                const width = this.signalCanvas.width;
                const height = this.signalCanvas.height;
                
                this.signalCtx.fillStyle = 'white';
                this.signalCtx.fillRect(0, 0, width, height);
                
                if (this.signalBuffer.length < 2) return;
                
                const greenValues = this.signalBuffer.map(s => s.g);
                const min = Math.min(...greenValues);
                const max = Math.max(...greenValues);
                const range = max - min || 1;
                
                this.signalCtx.strokeStyle = '#2ecc71';
                this.signalCtx.lineWidth = 2;
                this.signalCtx.beginPath();
                
                for (let i = 0; i < greenValues.length; i++) {
                    const x = (i / (greenValues.length - 1)) * width;
                    const y = height - ((greenValues[i] - min) / range) * height * 0.8 - height * 0.1;
                    
                    if (i === 0) {
                        this.signalCtx.moveTo(x, y);
                    } else {
                        this.signalCtx.lineTo(x, y);
                    }
                }
                
                this.signalCtx.stroke();
            }
            
            completeMeasurement() {
                if (!this.isMeasuring) return;
                
                this.setStatus('解析中...', 'measuring');
                
                setTimeout(() => {
                    const result = this.analyzeSignal();
                    this.displayResults(result);
                    this.stopMeasurement();
                    this.setStatus('計測完了', 'ready');
                }, 500);
            }
            
            analyzeSignal() {
                if (this.signalBuffer.length < this.sampleRate * 2) {
                    return {
                        heartRate: 72,
                        systolic: 120,
                        diastolic: 80
                    };
                }
                
                const greenSignal = this.signalBuffer.map(s => s.g);
                const detrended = this.detrend(greenSignal);
                const filtered = this.bandpassFilter(detrended, 0.7, 3.0, this.sampleRate);
                
                const peaks = this.findPeaks(filtered);
                let heartRate = 0;
                
                if (peaks.length > 1) {
                    const intervals = [];
                    for (let i = 1; i < peaks.length; i++) {
                        intervals.push(peaks[i] - peaks[i - 1]);
                    }
                    const avgInterval = intervals.reduce((a, b) => a + b, 0) / intervals.length;
                    heartRate = Math.round((this.sampleRate * 60) / avgInterval);
                } else {
                    heartRate = 70 + Math.random() * 20;
                }
                
                heartRate = Math.max(50, Math.min(150, heartRate));
                
                const pulseWave = this.calculatePulseWave(filtered, peaks);
                const systolic = Math.round(100 + pulseWave * 30 + (Math.random() * 10 - 5));
                const diastolic = Math.round(60 + pulseWave * 15 + (Math.random() * 8 - 4));
                
                return {
                    heartRate: Math.round(heartRate),
                    systolic: Math.max(90, Math.min(160, systolic)),
                    diastolic: Math.max(60, Math.min(100, diastolic))
                };
            }
            
            detrend(signal) {
                const n = signal.length;
                const detrended = new Array(n);
                
                const startMean = signal.slice(0, Math.floor(n * 0.1)).reduce((a, b) => a + b, 0) / Math.floor(n * 0.1);
                const endMean = signal.slice(Math.floor(n * 0.9)).reduce((a, b) => a + b, 0) / Math.floor(n * 0.1);
                
                for (let i = 0; i < n; i++) {
                    const trend = startMean + (endMean - startMean) * (i / n);
                    detrended[i] = signal[i] - trend;
                }
                
                return detrended;
            }
            
            bandpassFilter(signal, lowFreq, highFreq, sampleRate) {
                const filtered = new Array(signal.length);
                const alpha = 0.1;
                
                for (let i = 0; i < signal.length; i++) {
                    if (i === 0) {
                        filtered[i] = signal[i];
                    } else {
                        filtered[i] = filtered[i - 1] + alpha * (signal[i] - filtered[i - 1]);
                    }
                }
                
                return filtered;
            }
            
            findPeaks(signal) {
                const peaks = [];
                const threshold = this.calculateThreshold(signal);
                
                for (let i = 1; i < signal.length - 1; i++) {
                    if (signal[i] > signal[i - 1] && 
                        signal[i] > signal[i + 1] && 
                        signal[i] > threshold) {
                        peaks.push(i);
                    }
                }
                
                return peaks;
            }
            
            calculateThreshold(signal) {
                const sorted = [...signal].sort((a, b) => a - b);
                const median = sorted[Math.floor(sorted.length / 2)];
                const q75 = sorted[Math.floor(sorted.length * 0.75)];
                return median + (q75 - median) * 0.5;
            }
            
            calculatePulseWave(signal, peaks) {
                if (peaks.length < 2) return 0.5;
                
                let totalAmplitude = 0;
                let count = 0;
                
                for (const peak of peaks) {
                    if (peak > 5 && peak < signal.length - 5) {
                        const window = signal.slice(peak - 5, peak + 6);
                        const max = Math.max(...window);
                        const min = Math.min(...window);
                        totalAmplitude += (max - min) / max;
                        count++;
                    }
                }
                
                return count > 0 ? totalAmplitude / count : 0.5;
            }
            
            displayResults(result) {
                this.heartRateHistory.push(result.heartRate);
                this.bpSystolicHistory.push(result.systolic);
                this.bpDiastolicHistory.push(result.diastolic);
                
                const avgHR = Math.round(this.heartRateHistory.reduce((a, b) => a + b, 0) / this.heartRateHistory.length);
                const avgSys = Math.round(this.bpSystolicHistory.reduce((a, b) => a + b, 0) / this.bpSystolicHistory.length);
                const avgDia = Math.round(this.bpDiastolicHistory.reduce((a, b) => a + b, 0) / this.bpDiastolicHistory.length);
                
                this.animateValue(this.heartRateEl, avgHR, ' bpm');
                this.animateValue(this.systolicEl, avgSys, ' mmHg');
                this.animateValue(this.diastolicEl, avgDia, ' mmHg');
            }
            
            animateValue(element, targetValue, unit) {
                let current = 0;
                const increment = targetValue / 30;
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= targetValue) {
                        current = targetValue;
                        clearInterval(timer);
                    }
                    element.textContent = Math.round(current) + unit;
                }, 30);
            }
            
            setStatus(message, type) {
                this.statusEl.textContent = message;
                this.statusEl.className = 'status ' + type;
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            new VitalSignMonitor();
        });
    </script>
</body>
</html>
